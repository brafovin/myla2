<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Velura Logo">
  <defs>
    <linearGradient id="vl-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a2a4d"/>
      <stop offset="1" stop-color="#1b1426"/>
    </linearGradient>
    <linearGradient id="vl-mark" x1="14" y1="16" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0b48a"/>
      <stop offset="0.55" stop-color="#e07ba0"/>
      <stop offset="1" stop-color="#b85c9c"/>
    </linearGradient>
  </defs>
  <!-- abgerundetes App-Icon -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#vl-bg)" stroke="#4a3a5e" stroke-width="1.5"/>
  <!-- abstraktes "V" als Verbindung zweier Personen, die sich treffen -->
  <path d="M18 20 L32 44 L46 20" stroke="url(#vl-mark)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- zwei verbundene Knoten (Begegnung) -->
  <circle cx="18" cy="20" r="5" fill="#f0b48a"/>
  <circle cx="46" cy="20" r="5" fill="#e07ba0"/>
  <!-- Funke der Verbindung -->
  <circle cx="32" cy="44" r="3.2" fill="#ffffff" opacity="0.95"/>
</svg>
