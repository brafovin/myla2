<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Velura Logo">
  <defs>
    <linearGradient id="vl-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#352847"/>
      <stop offset="1" stop-color="#191124"/>
    </linearGradient>
    <linearGradient id="vl-left" x1="16" y1="14" x2="33" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3c39a"/>
      <stop offset="1" stop-color="#e08aa6"/>
    </linearGradient>
    <linearGradient id="vl-right" x1="48" y1="14" x2="33" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e07ba0"/>
      <stop offset="1" stop-color="#a8528f"/>
    </linearGradient>
  </defs>

  <!-- Abgerundetes App-Icon (neutraler Hintergrund) -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#vl-bg)" stroke="#4a3a5e" stroke-width="1.5"/>

  <!-- Origami-"V": zwei gefaltete Baender, die unten zusammenlaufen.
       Bewusst kein Kreis und keine Sprechblase. -->
  <!-- linkes Band -->
  <path d="M15 16 L25 16 L34 41 L31.5 49 Z" fill="url(#vl-left)"/>
  <!-- rechtes Band -->
  <path d="M49 16 L39 16 L30 41 L32.5 49 Z" fill="url(#vl-right)"/>
  <!-- feine Mittelfalte fuer den Ribbon-Effekt -->
  <path d="M32 47 L29.4 39.5 L32 32.5 L34.6 39.5 Z" fill="#ffffff" opacity="0.16"/>

  <!-- Funke / Akzent oben rechts -->
  <path d="M50 13.5 L51.3 16.3 L54 17.6 L51.3 18.9 L50 21.6 L48.7 18.9 L46 17.6 L48.7 16.3 Z" fill="#f3c39a"/>
</svg>
